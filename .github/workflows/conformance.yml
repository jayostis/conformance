name: conformance

# Two jobs on purpose.
#
#   runner-selftest  proves the runner is capable of failing. It mutates fixtures
#                    and shapes in temporary directories and asserts the runner
#                    notices. This job is green and must stay green: if it goes
#                    red, no result from the other job means anything.
#
#   fixture-suite    executes every fixture against the pinned shapes. It is red,
#                    and the failures it reports are real. It must never be made
#                    green by weakening an assertion, skipping a fixture, or
#                    baselining a failure list. See README.md, "Current status".

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"

jobs:
  runner-selftest:
    name: runner mutation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Check out the pinned spec revision
        run: |
          set -euo pipefail
          COMMIT="$(grep '^commit=' scripts/SPEC_PIN | cut -d= -f2)"
          REPO_URL="$(grep '^repo=' scripts/SPEC_PIN | cut -d= -f2)"
          echo "Pinned spec commit: ${COMMIT}"
          git clone --quiet "${REPO_URL}.git" "${RUNNER_TEMP}/spec"
          git -C "${RUNNER_TEMP}/spec" checkout --quiet "${COMMIT}"
          echo "CASCADE_SPEC_DIR=${RUNNER_TEMP}/spec" >> "$GITHUB_ENV"

      - name: Mutation tests
        # pipefail is NOT on by default in an Actions `run:` step, so a bare
        # `python ... | tee` would report the exit code of tee (always 0) and
        # turn a failing suite green.
        run: |
          set -o pipefail
          python scripts/selftest_runner.py --spec-dir "$CASCADE_SPEC_DIR" | tee selftest.txt

      - name: Summary
        if: always()
        run: |
          {
            echo '## Runner mutation tests'
            echo '```'
            cat selftest.txt 2>/dev/null || echo '(no output)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  fixture-suite:
    name: fixture suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Check out the pinned spec revision
        run: |
          set -euo pipefail
          COMMIT="$(grep '^commit=' scripts/SPEC_PIN | cut -d= -f2)"
          REPO_URL="$(grep '^repo=' scripts/SPEC_PIN | cut -d= -f2)"
          echo "Pinned spec commit: ${COMMIT}"
          git clone --quiet "${REPO_URL}.git" "${RUNNER_TEMP}/spec"
          git -C "${RUNNER_TEMP}/spec" checkout --quiet "${COMMIT}"
          echo "CASCADE_SPEC_DIR=${RUNNER_TEMP}/spec" >> "$GITHUB_ENV"

      - name: Run every fixture against the pinned shapes
        run: |
          set -o pipefail
          python scripts/run_conformance.py \
            --spec-dir "$CASCADE_SPEC_DIR" \
            --json conformance-results.json | tee conformance.txt

      - name: Summary
        if: always()
        run: |
          {
            echo '## Fixture suite'
            echo '```'
            sed -n '1,60p' conformance.txt 2>/dev/null || echo '(no output)'
            echo '```'
            echo '<details><summary>Full report</summary>'
            echo
            echo '```'
            cat conformance.txt 2>/dev/null || true
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-results
          path: |
            conformance.txt
            conformance-results.json
          if-no-files-found: warn
